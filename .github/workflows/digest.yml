name: Daily digest

on:
  # Started at 8:00 am and 8:00 pm Eastern by a cron-job.org job calling GitHub's
  # workflow dispatch API. GitHub's own `schedule:` trigger ran hours late, so it's not used.
  # Also runnable by hand from the Actions tab ("Run workflow").
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python digest.py
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          CANVAS_BASE_URL: https://canvas.mit.edu
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEZONE: America/New_York
