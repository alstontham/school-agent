name: Daily digest

on:
  schedule:
    # 8:00 am and 8:00 pm Eastern. GitHub cron is UTC, so both the EDT and EST
    # times are listed; digest.py only sends for the one that matches today.
    - cron: "0 12 * * *"  # 8 am EDT
    - cron: "0 13 * * *"  # 8 am EST
    - cron: "0 0 * * *"   # 8 pm EDT
    - cron: "0 1 * * *"   # 8 pm EST
  workflow_dispatch:  # "Run workflow" button for sending one manually

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python digest.py
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          CANVAS_BASE_URL: https://canvas.mit.edu
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEZONE: America/New_York
